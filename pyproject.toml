[project]
name = "my-modal-project"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "modal>=1.0.0",
    "torch>=2.4.0",
    "transformers>=5.17",
    "diffusers @ git+https://github.com/huggingface/diffusers",
    "torchvision",
    "accelerate",
    "pillow"
]

[dependency-groups]
dev = [
    "jupyter",
    "ipywidgets"
]