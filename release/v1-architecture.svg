<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1100" role="img" aria-labelledby="t d">
<title id="t">Nihonga v1 architecture</title>
<desc id="d">Qwen-Image-2.1 transformer with 32 slots: blocks 5 and 20 are replaced by small attention bridges, and a rank-32 adapter is fused into the attention of the other 30 blocks. Sampling uses 10 points of the stock 40-step schedule: three small steps, then seven large ones.</desc>
