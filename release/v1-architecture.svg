<text x="780.0" y="134" font-size="18" text-anchor="middle" fill="#231F1A" font-weight="bold">The fused adapter</text>
<text x="522" y="164" font-size="14" text-anchor="start" fill="#231F1A" >Rank 32 on q, k, v and out of the 30 blocks, trained so</text>
<text x="522" y="186" font-size="14" text-anchor="start" fill="#231F1A" >that one step lands where five steps of the pruned</text>
<text x="522" y="208" font-size="14" text-anchor="start" fill="#231F1A" >model’s own 40-step path land; letter tokens (found</text>
<text x="522" y="230" font-size="14" text-anchor="start" fill="#231F1A" >by OCR) weigh ten times in the loss.</text>
<text x="522" y="252" font-size="14" text-anchor="start" fill="#231F1A" ></text>
<text x="522" y="274" font-size="14" text-anchor="start" fill="#231F1A" >Merged once: W′ = W + B·A. No extra weights or time.</text>
