<path d="M150 200 V228" stroke="#231F1A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M280 200 V228" stroke="#231F1A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
