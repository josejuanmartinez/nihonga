<text x="213" y="94" font-size="12" text-anchor="middle" fill="#231F1A" >scale · gate</text>
<rect x="284" y="56" width="122" height="46" rx="2" fill="#E8D5B5" stroke="#231F1A" stroke-width="1.2"/>
<text x="345" y="76" font-size="15" text-anchor="middle" fill="#231F1A" >positions</text>
<text x="345" y="94" font-size="12" text-anchor="middle" fill="#231F1A" >RoPE</text>
<rect x="416" y="56" width="122" height="46" rx="2" fill="#E8D5B5" stroke="#231F1A" stroke-width="1.2"/>
<text x="477" y="76" font-size="15" text-anchor="middle" fill="#231F1A" >cache</text>
<text x="477" y="94" font-size="12" text-anchor="middle" fill="#231F1A" >prompt K, V</text>
<rect x="30" y="122" width="500" height="430" rx="4" fill="none" stroke="#5E564B" stroke-dasharray="5 4"/>
<text x="44" y="142" font-size="13" text-anchor="start" fill="#5E564B" >ATTENTION BRANCH · image tokens</text>
