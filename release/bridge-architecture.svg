<rect x="20" y="56" width="122" height="46" rx="2" fill="#C3D3DB" stroke="#231F1A" stroke-width="1.2"/>
<text x="81" y="76" font-size="15" text-anchor="middle" fill="#231F1A" >hidden h</text>
<text x="81" y="94" font-size="12" text-anchor="middle" fill="#231F1A" >4,096 per token</text>
<rect x="152" y="56" width="122" height="46" rx="2" fill="#E8D5B5" stroke="#231F1A" stroke-width="1.2"/>
