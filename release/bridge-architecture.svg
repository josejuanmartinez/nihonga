<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1060" role="img" aria-labelledby="t d">
<title id="t">The Nihonga bridge (slots 5 and 20)</title>
<desc id="d">Inputs: hidden states, the shared timestep modulation, token positions and a prefix key/value cache. An attention branch (8 heads of 128) updates image tokens, then a conditioned MLP branch updates all tokens. About 25.2 million weights, against 218 million in an original block. One replaces block 5 and one block 20.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#231F1A"/></marker></defs>
<rect width="560" height="1060" fill="#F7EEE3"/>
